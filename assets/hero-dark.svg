<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Dennis Do, Product Manager and Builder, Queens NYC. I direct AI agents to build and ship real product.">
  <title>Dennis Do, Product Manager and Builder</title>
  <style>
    .panel { fill: #050505; }
    .name  { fill: #F4F3F1; font: 600 62px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
    .role  { fill: #D4D4D8; font: 400 21px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.2px; }
    .meta  { fill: #98979D; font: 400 13px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 2.4px; }
    .tick  { fill: #7A7A82; font: 400 14px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 1.6px; }
    .slash { fill: #4A4A52; }
    .rule  { stroke: #26262A; stroke-width: 1; }
    .dot   { fill: #F4F3F1; }

    .rise { opacity: 0; animation: rise .9s cubic-bezier(.22,.61,.36,1) forwards; }
    .d1 { animation-delay: .15s; }
    .d2 { animation-delay: .35s; }
    .d3 { animation-delay: .55s; }
    .d4 { animation-delay: .75s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .draw {
      stroke-dasharray: 920; stroke-dashoffset: 920;
      animation: draw 1.5s cubic-bezier(.22,.61,.36,1) .8s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .pulse { animation: pulse 2.6s ease-in-out 1.6s infinite; }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

    .track { animation: scroll 38s linear infinite; }
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-1700px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .rise, .draw, .pulse, .track { animation: none; }
      .rise  { opacity: 1; }
      .draw  { stroke-dashoffset: 0; }
      .pulse { opacity: .7; }
    }
  </style>

  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0"    stop-color="#fff" stop-opacity="0" />
      <stop offset="0.05" stop-color="#fff" stop-opacity="1" />
      <stop offset="0.95" stop-color="#fff" stop-opacity="1" />
      <stop offset="1"    stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="edges">
      <rect x="0" y="252" width="1000" height="68" fill="url(#fade)" />
    </mask>
    <clipPath id="panelClip">
      <rect width="1000" height="320" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect class="panel" width="1000" height="320" />

    <text class="meta rise d1" x="48" y="58">PRODUCT MANAGER AND BUILDER</text>
    <text class="name rise d2" x="48" y="132">Dennis Do</text>
    <text class="role rise d3" x="48" y="176">I direct AI agents to build and ship real product.</text>

    <circle class="dot pulse" cx="53" cy="204" r="3.5" />
    <text class="meta rise d4" x="68" y="209">QUEENS, NYC</text>

    <line class="rule draw" x1="48" y1="252" x2="952" y2="252" />

    <g mask="url(#edges)">
      <g class="track">
        <text class="tick" x="48" y="292" textLength="1700" lengthAdjust="spacing">MAVENSTUDIO FOUNDER <tspan class="slash">/</tspan> AUTOBULLETIN <tspan class="slash">/</tspan> 413 YOUTH CLUB <tspan class="slash">/</tspan> EN HAKKORE CAFE <tspan class="slash">/</tspan> SCOUT PRODUCT DESIGNER <tspan class="slash">/</tspan> NASA L'SPACE PROJECT MANAGER <tspan class="slash">/</tspan> RESEARCH FOUNDATION OF CUNY <tspan class="slash">/</tspan></text>
        <text class="tick" x="1748" y="292" textLength="1700" lengthAdjust="spacing">MAVENSTUDIO FOUNDER <tspan class="slash">/</tspan> AUTOBULLETIN <tspan class="slash">/</tspan> 413 YOUTH CLUB <tspan class="slash">/</tspan> EN HAKKORE CAFE <tspan class="slash">/</tspan> SCOUT PRODUCT DESIGNER <tspan class="slash">/</tspan> NASA L'SPACE PROJECT MANAGER <tspan class="slash">/</tspan> RESEARCH FOUNDATION OF CUNY <tspan class="slash">/</tspan></text>
      </g>
    </g>
  </g>
</svg>
