<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="52" viewBox="0 0 1000 52" role="img" aria-label="Roles: MavenStudio Founder, AutoBulletin, 413 Youth Club, En Hakkore Cafe, Scout Product Designer, NASA L'SPACE Project Manager, Research Foundation of CUNY">
  <title>Where I have worked</title>
  <style>
    .bg   { fill: #FDFDFF; }
    .tick { fill: #71717A; font: 400 15px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 1.6px; }
    .slash { fill: #A1A1AA; }

    .track { animation: scroll 34s linear infinite; }
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-1700px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .track { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0"    stop-color="#fff" stop-opacity="0" />
      <stop offset="0.06" stop-color="#fff" stop-opacity="1" />
      <stop offset="0.94" stop-color="#fff" stop-opacity="1" />
      <stop offset="1"    stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="edges">
      <rect width="1000" height="52" fill="url(#fade)" />
    </mask>
  </defs>

  <rect class="bg" width="1000" height="52" />

  <g mask="url(#edges)">
    <g class="track">
      <text class="tick" x="0" y="33" textLength="1700" lengthAdjust="spacing">MAVENSTUDIO FOUNDER <tspan class="slash">/</tspan> AUTOBULLETIN <tspan class="slash">/</tspan> 413 YOUTH CLUB <tspan class="slash">/</tspan> EN HAKKORE CAFE <tspan class="slash">/</tspan> SCOUT PRODUCT DESIGNER <tspan class="slash">/</tspan> NASA L'SPACE PROJECT MANAGER <tspan class="slash">/</tspan> RESEARCH FOUNDATION OF CUNY <tspan class="slash">/</tspan></text>
      <text class="tick" x="1700" y="33" textLength="1700" lengthAdjust="spacing">MAVENSTUDIO FOUNDER <tspan class="slash">/</tspan> AUTOBULLETIN <tspan class="slash">/</tspan> 413 YOUTH CLUB <tspan class="slash">/</tspan> EN HAKKORE CAFE <tspan class="slash">/</tspan> SCOUT PRODUCT DESIGNER <tspan class="slash">/</tspan> NASA L'SPACE PROJECT MANAGER <tspan class="slash">/</tspan> RESEARCH FOUNDATION OF CUNY <tspan class="slash">/</tspan></text>
    </g>
  </g>
</svg>
